<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMEN - Liste attive</title>
<style>body{font-family:Arial,sans-serif;background:#eef1f4;margin:0;padding:16px;color:#111}.box{max-width:760px;margin:auto;background:white;border:3px solid #1f5f99;border-radius:14px;padding:18px}h1{color:#1f5f99;font-size:24px;margin-top:0}.list{display:grid;gap:12px}.item{border:2px solid #287a46;border-radius:10px;padding:12px}.name{font-weight:800;font-size:18px;word-break:break-word}.meta{font-size:13px;color:#555;margin:6px 0 10px}button,a.btn{border:0;border-radius:9px;padding:13px 16px;font-size:16px;font-weight:800;color:white;background:#287a46;display:inline-block;text-decoration:none;cursor:pointer}.back{background:#1f5f99;margin-top:16px}.warn{background:#fff4d8;border-left:5px solid #c58218;padding:10px;margin:12px 0}.ok{background:#eaf8ef;border-left:5px solid #287a46;padding:10px;margin:12px 0;display:none}</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><div class="box"><h1>LISTE ATTIVE</h1><div class="warn">Qui trovi i file delle liste già importate e conservate sul Mac. Premi <b>USA QUESTA LISTA</b> per renderla attiva nella Cartella Sanitaria.</div><div id="msg" class="ok"></div><div id="list" class="list">RICERCA LISTE...</div><a class="btn back" href="./">TORNA ALLA CARTELLA SANITARIA</a></div>
<script>
const DB='beltrami_lumen_files_v1',STORE='originali';
const norm=v=>String(v??'').trim().toLocaleUpperCase('it-IT');
function isoDate(v){if(!v)return'';if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);let x=String(v).trim(),m=x.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');if(/^\d{4}-\d{2}-\d{2}$/.test(x))return x;let n=Number(x);if(Number.isFinite(n)&&n>20000&&n<80000){let d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toISOString().slice(0,10)}return''}
function hk(v){return norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'')}
function findCol(h,n){for(const x of n){let i=h.indexOf(x);if(i>=0)return i}for(let i=0;i<h.length;i++)if(n.some(x=>h[i].includes(x)))return i;return-1}
function rowsToWorkers(rows){if(!rows.length)return[];const a={cognome:['COGNOME','SURNAME'],nome:['NOME','NAME'],full:['COGNOMENOME','NOMECOGNOME','NOMINATIVO','LAVORATORE','DIPENDENTE'],luogo:['LUOGODINASCITA','COMUNEDINASCITA','NATOA','NATAA','LUOGONASCITA'],data:['DATADINASCITA','DATANASCITA','NATOIL','NATAIL','DOB'],cf:['CODICEFISCALE','CODFISCALE','CODFISC','CF'],azienda:['AZIENDA','DATORE','DATORELAVORO','DITTA','SOCIETA'],mansione:['MANSIONE','QUALIFICA','PROFILO','RUOLO'],orario:['ORARIO','ORA','ORAVISITA','ORARIOVISITA','TURNO']};let aliases=Object.values(a).flat(),best=0,score=-1;for(let r=0;r<Math.min(rows.length,15);r++){let h=rows[r].map(hk),s=h.reduce((n,x)=>n+(aliases.some(k=>x===k||x.includes(k))?1:0),0);if(s>score){score=s;best=r}}let h=rows[best].map(hk),c=k=>findCol(h,a[k]),cc=c('cognome'),cn=c('nome'),cfu=c('full'),cl=c('luogo'),cd=c('data'),ccf=c('cf'),ca=c('azienda'),cm=c('mansione'),co=c('orario'),out=[];for(let r=best+1;r<rows.length;r++){let row=rows[r]||[];if(row.every(x=>!String(x??'').trim()))continue;let cognome=cc>=0?norm(row[cc]):'',nome=cn>=0?norm(row[cn]):'';if((!cognome||!nome)&&cfu>=0){let p=norm(row[cfu]).replace(/[,;]+/g,' ').split(/\s+/).filter(Boolean);if(p.length>1){cognome=cognome||p[0];nome=nome||p.slice(1).join(' ')}}if(!cognome&&!nome)continue;out.push({id:Date.now()+'_'+r+'_'+Math.random().toString(36).slice(2,6),cognome,nome,luogo_nascita:cl>=0?norm(row[cl]):'',data_nascita:cd>=0?isoDate(row[cd]):'',codice_fiscale:ccf>=0?norm(row[ccf]):'',datore_lavoro:ca>=0?norm(row[ca]):'',mansione:cm>=0?norm(row[cm]):'',orario:co>=0?String(row[co]??'').trim():'',visited:false})}return out}
function openDb(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(){let db=await openDb();return await new Promise((res,rej)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function activate(id){let rec=(await all()).find(x=>x.id===id);if(!rec)return;let name=(rec.name||'').toLowerCase(),rows=[];if(name.endsWith('.xlsx')){let wb=XLSX.read(await rec.blob.arrayBuffer(),{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}else if(name.endsWith('.csv')||name.endsWith('.tsv')){let txt=await rec.blob.text(),sep=name.endsWith('.tsv')?'\t':(txt.includes(';')?';':',');rows=txt.split(/\r?\n/).filter(Boolean).map(x=>x.split(sep))}else{alert('Per la selezione rapida immediata sono gestiti Excel/CSV.');return}let workers=rowsToWorkers(rows);if(!workers.length){alert('Nessun lavoratore riconosciuto in questa lista.');return}localStorage.setItem('beltrami_workers_v8',JSON.stringify({workers,currentWorkerIndex:-1,attachedSourceName:rec.name}));localStorage.setItem('beltrami_lista_originale_attiva_v1',JSON.stringify({id:rec.id,name:rec.name,type:rec.type,size:rec.size,lastModified:rec.lastModified,savedAt:rec.savedAt}));let m=document.getElementById('msg');m.style.display='block';m.textContent='LISTA ATTIVA: '+rec.name+' — '+workers.length+' lavoratori. Ora torno alla Cartella Sanitaria.';setTimeout(()=>location.href='./',700)}
(async()=>{try{let r=(await all()).sort((a,b)=>String(b.savedAt).localeCompare(String(a.savedAt))),box=document.getElementById('list');if(!r.length){box.textContent='Nessuna lista conservata su questo dispositivo.';return}box.innerHTML=r.map(x=>'<div class="item"><div class="name">'+String(x.name||'LISTA').replace(/[&<>]/g,'')+'</div><div class="meta">Salvata: '+new Date(x.savedAt).toLocaleString('it-IT')+'</div><button onclick="activate(\''+x.id+'\')">USA QUESTA LISTA</button></div>').join('')}catch(e){document.getElementById('list').textContent='Errore: '+e.message}})();
</script></body></html>
