name: Fix spirometry interpretation space

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-spirometry-space.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase spirometry interpretation space
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'min-height:150px;box-sizing:border-box;resize:vertical;line-height:1.4;padding:8px;font-size:14px': 'min-height:260px;box-sizing:border-box;resize:vertical;line-height:1.45;padding:10px;font-size:14px',
              '.compact-exams .spirometry-interpretation textarea{min-height:150px}': '.compact-exams .spirometry-interpretation textarea{min-height:260px}',
              '.spirometry-interpretation textarea,.compact-exams .spirometry-interpretation textarea{min-height:180px}': '.spirometry-interpretation textarea,.compact-exams .spirometry-interpretation textarea{min-height:300px}',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Pattern not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase spirometry interpretation space"
          git push
