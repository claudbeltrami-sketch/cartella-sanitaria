name: Patch audiometria LUMEN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-audiometria.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserisci soglie audiometriche DX SX
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="row"><div class="field"><label>Audiometria</label><select id="audiometria_esito"><option></option><option>NORMALE</option><option>ALTERATA</option></select></div><div class="field"><label>Difetto riscontrato</label><input id="audiometria_difetto" data-upper></div></div>'''
          new = '''<div class="section-title" style="margin-top:6px">Audiometria – soglia uditiva (dB)</div>
<div class="small" style="margin:0 0 5px">Inserire la soglia minima percepita per ciascuna frequenza, separatamente per orecchio destro e sinistro.</div>
<div class="row"><div class="field"><label>Esito</label><select id="audiometria_esito"><option></option><option>NORMALE</option><option>ALTERATA</option></select></div><div class="field"><label>Difetto riscontrato</label><input id="audiometria_difetto" data-upper></div></div>
<div class="row3"><div class="field"><label>DX 500 Hz (dB)</label><input id="audio_dx_500" type="number" inputmode="numeric" step="5"></div><div class="field"><label>DX 1000 Hz (dB)</label><input id="audio_dx_1000" type="number" inputmode="numeric" step="5"></div><div class="field"><label>DX 2000 Hz (dB)</label><input id="audio_dx_2000" type="number" inputmode="numeric" step="5"></div><div class="field"><label>DX 4000 Hz (dB)</label><input id="audio_dx_4000" type="number" inputmode="numeric" step="5"></div><div class="field"><label>SX 500 Hz (dB)</label><input id="audio_sx_500" type="number" inputmode="numeric" step="5"></div><div class="field"><label>SX 1000 Hz (dB)</label><input id="audio_sx_1000" type="number" inputmode="numeric" step="5"></div><div class="field"><label>SX 2000 Hz (dB)</label><input id="audio_sx_2000" type="number" inputmode="numeric" step="5"></div><div class="field"><label>SX 4000 Hz (dB)</label><input id="audio_sx_4000" type="number" inputmode="numeric" step="5"></div><div></div></div>'''
          if old not in s:
              raise SystemExit('Blocco audiometria atteso non trovato: nessuna modifica eseguita')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "LUMEN: aggiunge soglie audiometriche 500-4000 Hz DX/SX"
          git push
