name: Attiva cambio lista

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserisce o aggiorna il modulo cambio lista
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="cambia-lista.js?v=20260828"></script>'
          new='<script src="cambia-lista.js?v=20260828-cancella2"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              if '</body>' not in s:
                  raise SystemExit('Tag </body> non trovato')
              s=s.replace('</body>', new+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Pubblica la modifica
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Forza caricamento CANCELLA lavoratore"
          git push
