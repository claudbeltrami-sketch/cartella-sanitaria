name: Attiva cambio lista

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forza versione corrente del modulo LUMEN
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="cambia-lista.js?v=20260929-1"></script>'
          pattern=r'<script src="cambia-lista\.js(?:\?v=[^"]*)?"></script>'
          if re.search(pattern,s):
              raise SystemExit(0)  # Conserva la versione scelta dal progetto.
          elif '</body>' in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          else:
              raise SystemExit('Tag </body> non trovato')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Pubblica la modifica
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Forza hotfix PDF cumulativo V3"
          git push
