name: Fix PDF cumulativo Mac V4

on:
  push:
    paths:
      - '.github/workflows/fix-pdf-download-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi cache e caricamento modulo certificati
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          build = '20260908-pdf-cumulativo-mac-v4'

          # Il build dichiarato e quello controllato a pageshow devono coincidere.
          s = re.sub(r'<meta name="lumen-build" content="[^"]+">',
                     f'<meta name="lumen-build" content="{build}">', s, count=1)
          s = re.sub(r"var build='[^']+';window\.addEventListener\('pageshow'",
                     f"var build='{build}';window.addEventListener('pageshow'", s, count=1)

          # Carica una sola volta il modulo esterno. Le tre inclusioni precedenti
          # potevano lasciare in Safari copie cache diverse dello stesso script.
          s = re.sub(
              r'(?:<script src="cambia-lista\.js\?v=[^"]+"></script>\s*){2,}',
              '<script src="cambia-lista.js?v=20260908-pdf-cumulativo-v4"></script>\n',
              s,
              count=1
          )

          # Anche nel caso fosse rimasta una singola inclusione, forza V4.
          s = re.sub(r'<script src="cambia-lista\.js\?v=[^"]+"></script>',
                     '<script src="cambia-lista.js?v=20260908-pdf-cumulativo-v4"></script>',
                     s,
                     count=1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verifica correzione
        run: |
          grep -q 'content="20260908-pdf-cumulativo-mac-v4"' index.html
          grep -q "var build='20260908-pdf-cumulativo-mac-v4'" index.html
          test "$(grep -o 'cambia-lista.js?v=' index.html | wc -l)" -eq 1

      - name: Commit della correzione
        run: |
          git config user.name "LUMEN Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix definitivo caricamento PDF cumulativo Mac V4"
          git push
