name: Verifica firme sopralluogo
on:
  push:
    branches: [feature/firme-sopralluogo-20260917, main]
    paths: [sopralluogo.html, sopralluogo.js, sopralluogo-fields.js, sopralluogo-modello.pdf, vendor/**, tests/sopralluogo.cjs, .github/workflows/sopralluogo.yml]
permissions:
  contents: read
jobs:
  signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/lumen-check --no-save playwright@1.51.1
          node /tmp/lumen-check/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Firme, salvataggi e PDF
        env:
          NODE_PATH: /tmp/lumen-check/node_modules
          REPORT_TEST_OUT: tmp/sopralluogo
        run: |
          timeout 180s node tests/sopralluogo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sopralluogo-verifica
          path: tmp/sopralluogo/
          retention-days: 7
