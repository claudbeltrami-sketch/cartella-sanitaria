# Sostituisce la vecchia patch una tantum, che non deve più riscrivere index.html.
name: Verifica audiometria LUMEN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/patch-audiometria-v2.yml'
  pull_request:
    paths:
      - 'index.html'
      - '.github/workflows/patch-audiometria-v2.yml'
      - '.github/workflows/patch-audiometria.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica le soglie esistenti senza modificare il programma
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          class Inputs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = Counter()
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'input' and a.get('type') == 'number':
                      self.ids[a.get('id')] += 1
          p = Inputs()
          p.feed(Path('index.html').read_text(encoding='utf-8'))
          expected = [f'audio_{side}_{hz}' for side in ('dx','sx') for hz in (500,1000,2000,4000)]
          bad = [i for i in expected if p.ids[i] != 1]
          if bad:
              raise SystemExit('Campi audiometrici mancanti o duplicati: ' + ', '.join(bad))
          print('PASS: otto soglie audiometriche DX/SX presenti una volta ciascuna')
          PY
