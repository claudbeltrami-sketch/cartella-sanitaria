name: Compact spirometry values layout

on:
  push:
    paths:
      - '.github/workflows/fix-spiro-layout.yml'

permissions:
  contents: write

jobs:
  compact-spirometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact FVC FEV1 PEF table
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('<h3>SPIROMETRIA</h3>')
          if start < 0:
              raise SystemExit('SPIROMETRIA section not found')

          end_marker = 'Valutazione automatica indicativa'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('Spirometry evaluation marker not found')

          block = s[start:end]

          old_table = '<table class="mini-table">'
          new_table = '<table class="mini-table" style="width:420px;max-width:100%;">'
          if old_table in block:
              block = block.replace(old_table, new_table, 1)
          elif new_table not in block:
              raise SystemExit('Spirometry table not found')

          block = block.replace('style="width:110px;"', 'style="width:78px;"')
          s = s[:start] + block + s[end:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Compact spirometry value fields"
            git push
          fi
