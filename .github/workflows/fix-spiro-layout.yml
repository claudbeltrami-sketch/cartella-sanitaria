name: Compact spirometry values layout

on:
  push:
    paths:
      - '.github/workflows/fix-spiro-layout.yml'

permissions:
  contents: write

jobs:
  compact-spirometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact FVC FEV1 PEF values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          required = ['spirometria_fvc','spirometria_fvc_percentuale','spirometria_fev1','spirometria_fev1_percentuale','spirometria_pef','spirometria_pef_percentuale']
          missing = [x for x in required if f'id="{x}"' not in s]
          if missing:
              raise SystemExit('Missing spirometry IDs: ' + ', '.join(missing))

          marker = '/* LUMEN: valori spirometrici compatti v2 */'
          css_lines = [
              '',
              marker,
              '.compact-exams .row3:has(#spirometria_fvc){grid-template-columns:245px 130px;max-width:390px;gap:5px 10px;align-items:end}',
              '.compact-exams .row3:has(#spirometria_fvc)>div:empty{display:none}',
              '.compact-exams .row3:has(#spirometria_fvc) .field{justify-content:flex-start}',
              '.compact-exams .row3:has(#spirometria_fvc) .field input{width:72px!important;flex:0 0 72px!important;min-width:0!important}',
              '@media(max-width:850px){.compact-exams .row3:has(#spirometria_fvc){grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:100%;gap:5px 8px}.compact-exams .row3:has(#spirometria_fvc) .field input{width:64px!important;flex-basis:64px!important}}',
              ''
          ]
          css = '\n'.join(css_lines)

          if marker not in s:
              close = s.find('</style>')
              if close < 0:
                  raise SystemExit('Style closing tag not found')
              s = s[:close] + css + s[close:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Compact spirometry value fields"
            git push
          fi
