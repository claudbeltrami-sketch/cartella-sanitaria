name: Compact spirometry values layout

on:
  push:
    paths:
      - '.github/workflows/fix-spiro-layout.yml'

permissions:
  contents: write

jobs:
  compact-spirometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact FVC FEV1 PEF table
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          required = ['spiro_fvc_l','spiro_fvc_pct','spiro_fev1_l','spiro_fev1_pct','spiro_pef_ls','spiro_pef_pct']
          missing = [x for x in required if f'id="{x}"' not in s]
          if missing:
              raise SystemExit('Missing spirometry IDs: ' + ', '.join(missing))

          marker = '/* LUMEN: spirometria valori compatti */'
          css = '''
/* LUMEN: spirometria valori compatti */
table:has(#spiro_fvc_l){width:420px!important;max-width:100%!important;table-layout:auto}
#spiro_fvc_l,#spiro_fvc_pct,#spiro_fev1_l,#spiro_fev1_pct,#spiro_pef_ls,#spiro_pef_pct{width:78px!important;min-width:0!important}
@media(max-width:850px){table:has(#spiro_fvc_l){width:100%!important}}
'''

          if marker not in s:
              close = s.find('</style>')
              if close < 0:
                  raise SystemExit('Style closing tag not found')
              s = s[:close] + css + s[close:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Compact spirometry value fields"
            git push
          fi
