<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conteggio Visite</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:#f3f6fb}
  *{box-sizing:border-box}
  body{margin:0;background:#f3f6fb}
  header{background:#0b2d5c;color:white;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  h1{font-size:22px;margin:0}
  button{font:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,23,42,.08)}
  label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px}
  input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white}
  textarea{min-height:92px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer}
  .primary{background:#1565c0;color:white}
  .secondary{background:#e2e8f0;color:#0f172a}
  .danger{background:#b91c1c;color:white}
  .ok{background:#15803d;color:white}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .total{font-size:36px;font-weight:800;text-align:center;margin:8px 0}
  .small{font-size:13px;color:#475569}
  .list{display:flex;flex-direction:column;gap:10px}
  .visit{border:1px solid #dbe2ea;border-radius:12px;padding:12px}
  .visit.checked{background:#ecfdf5;border-color:#86efac}
  .visit-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
  .visit-name{
    font-size:17px;font-weight:800;line-height:1.28;
    white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;
    width:100%;min-width:0
  }
  .visit-company{font-size:14px;color:#475569;margin-top:4px;word-break:break-word}
  .visit-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .visit-actions button{padding:8px 10px;border-radius:8px;border:0;font-weight:700}
  .counter{display:flex;align-items:center;justify-content:center;gap:18px}
  .counter button{width:48px;height:48px;border-radius:50%;border:0;font-size:25px;font-weight:800}
  .hidden{display:none}
  #photoPreview{max-width:100%;border-radius:10px;margin-top:10px}
  .filter-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .filter-chip{display:flex;align-items:center;gap:7px;border:1px solid #cbd5e1;border-radius:999px;padding:8px 10px;background:#fff;font-weight:700;font-size:13px}
  .filter-chip input{width:20px;height:20px;margin:0}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .summary-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center}
  .summary-num{font-size:24px;font-weight:800}
  .summary-label{font-size:12px;color:#475569;margin-top:3px}
  .summary-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  .summary-table th,.summary-table td{padding:9px 6px;border-bottom:1px solid #e2e8f0;text-align:left}
  .summary-table th:nth-child(n+2),.summary-table td:nth-child(n+2){text-align:right}
  .save-note{font-size:12px;color:#15803d;margin-top:8px;min-height:16px}
  @media(max-width:520px){
    .wrap{padding:10px}
    .card{padding:13px}
    .row,.row3{grid-template-columns:1fr}
    .visit-top{grid-template-columns:auto minmax(0,1fr)}
    .visit-top .delete-top{grid-column:2;justify-self:end}
    .visit-name{font-size:16px}
  }
</style>
</head>
<body>
<header>
  <h1>Conteggio Visite</h1>
  <button class="btn secondary" id="resetBtn">Reset</button>
</header>

<div class="wrap">
  <div class="card">
    <div class="total" id="total">0</div>
    <div class="counter">
      <button class="secondary" id="minusBtn">−</button>
      <button class="primary" id="plusBtn">+</button>
    </div>
    <div class="small" style="text-align:center;margin-top:8px">Visite effettuate nella lista corrente</div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Cognome</label>
        <input id="surname" autocomplete="off">
      </div>
      <div>
        <label>Nome</label>
        <input id="name" autocomplete="off">
      </div>
    </div>
    <label>Azienda</label>
    <input id="company" autocomplete="off">
    <div class="toolbar" style="margin-top:12px">
      <button class="btn primary" id="addBtn">Aggiungi visita</button>
      <button class="btn secondary" id="newListBtn">Nuova lista</button>
      <button class="btn danger" id="deleteListBtn">Elimina lista</button>
    </div>
  </div>

  <div class="card">
    <label>Lista / giornata</label>
    <select id="listSelect"></select>
    <div class="row">
      <div>
        <label>Data</label>
        <input type="date" id="listDate">
      </div>
      <div>
        <label>Committente</label>
        <input id="client" placeholder="es. ADÒC, XENIAMED">
      </div>
    </div>
    <label>Sede / nota</label>
    <input id="site" placeholder="es. Guidonia">
    <button class="btn secondary" id="saveMetaBtn" style="margin-top:12px">Salva dati lista</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <label class="btn secondary" style="margin:0;display:inline-block">
        Importa file/foto
        <input id="fileInput" type="file" accept="image/*,.csv,.txt,.xlsx,.xls,.pdf,.docx" style="display:none">
      </label>
      <button class="btn secondary" id="exportBtn">Esporta backup</button>
      <label class="btn secondary" style="margin:0;display:inline-block">
        Importa backup
        <input id="backupInput" type="file" accept=".json,application/json" style="display:none">
      </label>
    </div>
    <div id="importStatus" class="small" style="margin-top:10px"></div>
    <img id="photoPreview" class="hidden" alt="Anteprima foto">
    <textarea id="ocrText" class="hidden" placeholder="Testo riconosciuto: controlla e correggi prima di importare. Una persona per riga."></textarea>
    <button class="btn primary hidden" id="importTextBtn" style="margin-top:10px">Importa righe riconosciute</button>
  </div>

  <div class="card">
    <div class="toolbar" style="justify-content:space-between;align-items:center">
      <strong>Elenco</strong>
      <span id="countLabel" class="small"></span>
    </div>
    <div id="visitList" class="list" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div class="toolbar" style="justify-content:space-between;align-items:center">
      <strong>Riepilogo per committente</strong>
      <div class="toolbar">
        <button class="btn secondary" id="selectAllClientsBtn" type="button">Tutti</button>
        <button class="btn secondary" id="clearClientsBtn" type="button">Nessuno</button>
      </div>
    </div>
    <div class="small" style="margin-top:6px">Seleziona uno o più committenti per vedere solo i loro dati complessivi.</div>
    <div id="clientFilters" class="filter-grid"></div>
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-num" id="summaryLists">0</div><div class="summary-label">Liste</div></div>
      <div class="summary-box"><div class="summary-num" id="summaryVisits">0</div><div class="summary-label">Visite effettuate</div></div>
      <div class="summary-box"><div class="summary-num" id="summaryMoney">€ 0,00</div><div class="summary-label">Compensi stimati</div></div>
    </div>
    <div id="summaryDetails"></div>
  </div>

  <div class="card">
    <strong>Compensi</strong>
    <div class="row">
      <div>
        <label>Compenso per visita (€)</label>
        <input id="fee" inputmode="decimal" type="number" step="0.01" min="0">
      </div>
      <div>
        <label>Totale stimato (€)</label>
        <input id="moneyTotal" readonly>
      </div>
    </div>
    <button class="btn secondary" id="saveFeeBtn" style="margin-top:12px">Salva compenso</button>
    <div id="saveNote" class="save-note"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
const STORAGE_KEY='conteggio_visite_v2';
const LEGACY_KEYS=['conteggioVisite','conteggio-visite','visiteData','conteggio_visite'];
let state={lists:[],currentId:null,fees:{},clientFilter:[]};

const $=id=>document.getElementById(id);
const upper=s=>(s||'').toLocaleUpperCase('it-IT').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function today(){ return new Date().toISOString().slice(0,10); }
function current(){ return state.lists.find(x=>x.id===state.currentId); }

function load(){
  try{
    let x=localStorage.getItem(STORAGE_KEY);
    if(!x){ for(const k of LEGACY_KEYS){ const y=localStorage.getItem(k); if(y){x=y;break;} } }
    if(x) state=JSON.parse(x);
  }catch(e){}
  if(!Array.isArray(state.lists)) state.lists=[];
  if(!state.fees) state.fees={};
  if(!Array.isArray(state.clientFilter)) state.clientFilter=[];
  if(!state.lists.length) createList(false);
  if(!state.currentId || !current()) state.currentId=state.lists[0].id;
  renderAll();
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  localStorage.setItem(STORAGE_KEY+'_backup',JSON.stringify({savedAt:new Date().toISOString(),state}));
}
function createList(render=true){
  const l={id:uid(),date:today(),client:'',site:'',visits:[]};
  state.lists.unshift(l); state.currentId=l.id; save();
  if(render) renderAll();
}
function listTitle(l){
  const bits=[l.date||'SENZA DATA', upper(l.client), upper(l.site)].filter(Boolean);
  return bits.join(' · ') || 'LISTA';
}
function renderAll(){
  const l=current(); if(!l) return;
  $('listSelect').innerHTML=state.lists.map(x=>`<option value="${x.id}" ${x.id===state.currentId?'selected':''}>${escapeHtml(listTitle(x))}</option>`).join('');
  $('listDate').value=l.date||'';
  $('client').value=l.client||'';
  $('site').value=l.site||'';
  $('fee').value=state.fees[upper(l.client)] ?? '';
  renderVisits();
  renderClientSummary();
}
function allClients(){
  return [...new Set(state.lists.map(l=>upper(l.client)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
}
function selectedClients(){
  const clients=allClients();
  const valid=(state.clientFilter||[]).filter(c=>clients.includes(c));
  return valid.length ? valid : clients;
}
function renderClientSummary(){
  const clients=allClients();
  state.clientFilter=(state.clientFilter||[]).filter(c=>clients.includes(c));
  const selected=selectedClients();

  $('clientFilters').innerHTML=clients.length
    ? clients.map(c=>`<label class="filter-chip"><input type="checkbox" class="client-filter" value="${escapeHtml(c)}" ${selected.includes(c)?'checked':''}>${escapeHtml(c)}</label>`).join('')
    : '<span class="small">Nessun committente ancora registrato.</span>';

  document.querySelectorAll('.client-filter').forEach(cb=>{
    cb.onchange=()=>{
      const checked=[...document.querySelectorAll('.client-filter:checked')].map(x=>x.value);
      state.clientFilter=checked;
      save(); renderClientSummary();
    };
  });

  const filtered=state.lists.filter(l=>selected.includes(upper(l.client)));
  const detail=selected.map(client=>{
    const lists=filtered.filter(l=>upper(l.client)===client);
    const done=lists.reduce((s,l)=>s+(l.visits||[]).filter(v=>v.checked).length,0);
    const fee=parseFloat(state.fees[client]||0)||0;
    return {client,lists:lists.length,done,money:done*fee};
  });
  const totalLists=filtered.length;
  const totalVisits=detail.reduce((s,x)=>s+x.done,0);
  const totalMoney=detail.reduce((s,x)=>s+x.money,0);
  $('summaryLists').textContent=totalLists;
  $('summaryVisits').textContent=totalVisits;
  $('summaryMoney').textContent=totalMoney.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
  $('summaryDetails').innerHTML=detail.length ? `<table class="summary-table"><thead><tr><th>Committente</th><th>Liste</th><th>Visite</th><th>Totale</th></tr></thead><tbody>${detail.map(x=>`<tr><td>${escapeHtml(x.client)}</td><td>${x.lists}</td><td>${x.done}</td><td>${x.money.toLocaleString('it-IT',{style:'currency',currency:'EUR'})}</td></tr>`).join('')}</tbody></table>` : '';
}
function renderVisits(){
  const l=current(); const visits=l?.visits||[];
  const done=visits.filter(v=>v.checked).length;
  $('total').textContent=done;
  $('countLabel').textContent=`${done} visitate su ${visits.length}`;
  const fee=parseFloat($('fee').value||state.fees[upper(l?.client)]||0)||0;
  $('moneyTotal').value=(done*fee).toFixed(2);
  $('visitList').innerHTML=visits.map(v=>`
    <div class="visit ${v.checked?'checked':''}" data-id="${v.id}">
      <div class="visit-top">
        <input type="checkbox" class="check" ${v.checked?'checked':''} style="width:24px;height:24px;margin-top:2px">
        <div>
          <div class="visit-name">${escapeHtml([v.surname,v.name].filter(Boolean).join(' '))}</div>
          <div class="visit-company">${escapeHtml(v.company||'')}</div>
        </div>
        <button class="btn danger delete-top del">Elimina</button>
      </div>
      <div class="visit-actions">
        <button class="secondary edit">Modifica</button>
      </div>
    </div>`).join('') || '<div class="small">Nessun nominativo in questa lista.</div>';

  document.querySelectorAll('.visit').forEach(el=>{
    const id=el.dataset.id;
    el.querySelector('.check').onchange=e=>{const v=visits.find(x=>x.id===id);v.checked=e.target.checked;save();renderVisits();renderClientSummary()};
    el.querySelector('.del').onclick=()=>{if(!confirm('Eliminare questo nominativo?'))return;l.visits=l.visits.filter(x=>x.id!==id);save();renderVisits();renderClientSummary()};
    el.querySelector('.edit').onclick=()=>{
      const v=visits.find(x=>x.id===id); if(!v)return;
      $('surname').value=v.surname||'';$('name').value=v.name||'';$('company').value=v.company||'';
      l.visits=l.visits.filter(x=>x.id!==id);save();renderVisits();window.scrollTo({top:0,behavior:'smooth'});
    }
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function addVisit(surname,name,company){
  const l=current(); if(!l)return;
  surname=upper(surname);name=upper(name);company=upper(company);
  if(!surname && !name)return false;
  if(l.visits.some(v=>upper(v.surname)===surname&&upper(v.name)===name&&upper(v.company)===company))return false;
  l.visits.push({id:uid(),surname,name,company,checked:false});
  return true;
}
function parseLines(text){
  return text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x && !/^[,.;:\-]+$/.test(x));
}
function importLines(text){
  const lines=parseLines(text);
  const defaultCompany=upper($('company').value)||upper(current().client);
  let n=0;
  for(const line of lines){
    let parts=line.split(/[;\t,]+/).map(upper).filter(Boolean);
    if(parts.length>=2){
      if(addVisit(parts[0],parts[1],parts.slice(2).join(' ')||defaultCompany))n++;
    }else{
      const words=upper(line).split(/\s+/).filter(Boolean);
      if(words.length>=2 && addVisit(words[0],words.slice(1).join(' '),defaultCompany))n++;
    }
  }
  save();renderVisits();renderClientSummary();return n;
}

$('surname').addEventListener('input',e=>e.target.value=e.target.value.toLocaleUpperCase('it-IT'));
$('name').addEventListener('input',e=>e.target.value=e.target.value.toLocaleUpperCase('it-IT'));
$('company').addEventListener('input',e=>e.target.value=e.target.value.toLocaleUpperCase('it-IT'));
$('client').addEventListener('input',e=>e.target.value=e.target.value.toLocaleUpperCase('it-IT'));
$('site').addEventListener('input',e=>e.target.value=e.target.value.toLocaleUpperCase('it-IT'));

$('addBtn').onclick=()=>{
  const ok=addVisit($('surname').value,$('name').value,$('company').value);
  $('surname').value='';$('name').value='';save();renderVisits();renderClientSummary();$('surname').focus();
  $('saveNote').textContent=ok?'Nominativo salvato automaticamente.':'Nominativo vuoto o già presente.';
  setTimeout(()=>$('saveNote').textContent='',1800);
};
$('newListBtn').onclick=()=>createList();
$('deleteListBtn').onclick=()=>{const l=current();if(!l)return;if(!confirm('Eliminare definitivamente questa lista?'))return;state.lists=state.lists.filter(x=>x.id!==l.id);if(!state.lists.length)createList(false);state.currentId=state.lists[0].id;save();renderAll();};
$('selectAllClientsBtn').onclick=()=>{state.clientFilter=allClients();save();renderClientSummary();};
$('clearClientsBtn').onclick=()=>{state.clientFilter=[];save();renderClientSummary();};
$('listSelect').onchange=e=>{state.currentId=e.target.value;save();renderAll()};
$('saveMetaBtn').onclick=()=>{
  const l=current();l.date=$('listDate').value;l.client=upper($('client').value);l.site=upper($('site').value);save();renderAll();
  $('saveNote').textContent='Dati lista salvati automaticamente.';
  setTimeout(()=>$('saveNote').textContent='',1800);
};
$('saveFeeBtn').onclick=()=>{
  const key=upper(current().client); if(!key){alert('Inserisci prima il committente.');return}
  state.fees[key]=parseFloat($('fee').value)||0;save();renderVisits();renderClientSummary();
  $('saveNote').textContent='Compenso salvato per '+key+'.';
  setTimeout(()=>$('saveNote').textContent='',1800);
};
$('fee').oninput=()=>{renderVisits();renderClientSummary();};
$('plusBtn').onclick=()=>{const v=(current().visits||[]).find(x=>!x.checked);if(v){v.checked=true;save();renderVisits();renderClientSummary()}};
$('minusBtn').onclick=()=>{const a=(current().visits||[]).filter(x=>x.checked);const v=a[a.length-1];if(v){v.checked=false;save();renderVisits();renderClientSummary()}};
$('resetBtn').onclick=()=>{
  if(confirm('Azzero SOLO le spunte della lista corrente? I nominativi restano.')){
    current().visits.forEach(v=>v.checked=false);save();renderVisits();renderClientSummary();
  }
};

$('exportBtn').onclick=()=>{
  save();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='conteggio_visite_backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
};
$('backupInput').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const x=JSON.parse(await f.text()); if(!Array.isArray(x.lists))throw 0; state=x;save();renderAll();alert('Backup importato.');}
  catch{alert('Backup non valido.')}
  e.target.value='';
};

$('fileInput').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  $('importStatus').textContent='Lettura in corso…';
  try{
    if(/\.(csv|txt)$/i.test(f.name) || f.type.startsWith('text/')){
      const n=importLines(await f.text()); $('importStatus').textContent=`Importate ${n} righe.`;
    } else if(/\.(xlsx|xls)$/i.test(f.name)){
      if(!window.XLSX) throw new Error('Modulo Excel non disponibile');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let n=0;
      for(const r of rows){
        const cells=r.map(x=>upper(String(x))).filter(Boolean);
        if(cells.length<2)continue;
        if(/COGNOME|NOME/.test(cells.join(' ')) && n===0)continue;
        if(addVisit(cells[0],cells[1],cells[2]||upper($('company').value)||upper(current().client)))n++;
      }
      save();renderVisits();$('importStatus').textContent=`Importate ${n} righe da Excel.`;
    } else if(/\.pdf$/i.test(f.name) || f.type==='application/pdf'){
      if(!window.pdfjsLib) throw new Error('Modulo PDF non disponibile');
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let txt='';
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();txt+=c.items.map(x=>x.str).join(' ')+'\n';}
      const n=importLines(txt); $('importStatus').textContent=`Importate ${n} righe da PDF.`;
    } else if(/\.docx$/i.test(f.name)){
      if(!window.mammoth) throw new Error('Modulo Word non disponibile');
      const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()}); const n=importLines(r.value||'');
      $('importStatus').textContent=`Importate ${n} righe da Word.`;
    } else if(f.type.startsWith('image/') || /\.(heic|heif|jpg|jpeg|png)$/i.test(f.name)){
      const url=URL.createObjectURL(f); $('photoPreview').src=url;$('photoPreview').classList.remove('hidden');
      if(!window.Tesseract) throw new Error('Modulo OCR non disponibile');
      $('importStatus').textContent='Riconoscimento foto in corso…';
      const {data:{text}}=await Tesseract.recognize(f,'ita');
      $('ocrText').value=text;$('ocrText').classList.remove('hidden');$('importTextBtn').classList.remove('hidden');
      $('importStatus').textContent='Foto letta: controlla il testo e premi “Importa righe riconosciute”.';
    } else throw new Error('Formato non supportato');
  }catch(err){$('importStatus').textContent='Non sono riuscito a leggere questo file. Prova con foto, PDF, Word, Excel, CSV o TXT.'}
  e.target.value='';
};
$('importTextBtn').onclick=()=>{
  const n=importLines($('ocrText').value);$('importStatus').textContent=`Importate ${n} righe dalla foto.`;
