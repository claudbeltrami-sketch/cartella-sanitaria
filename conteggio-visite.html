<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conteggio Visite</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:#f3f6fb}header{background:#0b2d5c;color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}h1{font-size:22px;margin:0}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0f172a14}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-weight:800;font-size:13px;margin:8px 0 5px}input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800}.primary{background:#1565c0;color:#fff}.secondary{background:#e2e8f0}.danger{background:#c81e1e;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.total{text-align:center;font-size:42px;font-weight:900}.counter{display:flex;justify-content:center;gap:20px;margin:8px}.counter button{width:52px;height:52px;border-radius:50%;font-size:26px}.small{font-size:13px;color:#475569}.visit{border:1px solid #dbe2ea;border-radius:12px;padding:11px;margin-top:9px}.visit.checked{background:#ecfdf5}.visitTop{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}.visitName{font-weight:900}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{display:flex;align-items:center;gap:5px;border:1px solid #cbd5e1;border-radius:999px;padding:7px 9px;font-weight:700}.chip input{width:20px;height:20px;margin:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center}.box b{font-size:22px;display:block}.feeRow{display:grid;grid-template-columns:1fr 110px 82px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0}.feeRow input{margin:0}.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.tbl td,.tbl th{border-bottom:1px solid #e2e8f0;padding:7px 4px;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}@media(max-width:540px){.row{grid-template-columns:1fr}.feeRow{grid-template-columns:1fr 105px}.feeRow button{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr 1fr}.wrap{padding:9px}}</style></head><body><header><h1>Conteggio Visite</h1><button class="btn secondary" id="reset">Reset</button></header><div class="wrap"><div class="card"><div id="total" class="total">0</div><div class="counter"><button id="minus" class="btn secondary">−</button><button id="plus" class="btn primary">+</button></div><div class="small" style="text-align:center">Visite effettuate nella lista corrente</div></div><div class="card"><div class="row"><div><label>Cognome</label><input id="surname"></div><div><label>Nome</label><input id="name"></div></div><label>Azienda</label><input id="company"><div class="toolbar" style="margin-top:11px"><button id="add" class="btn primary">Aggiungi visita</button><button id="newList" class="btn secondary">Nuova lista</button><button id="deleteList" class="btn danger">Elimina lista</button></div></div><div class="card"><label>Lista / giornata</label><select id="listSelect"></select><div class="row"><div><label>Data</label><input type="date" id="date"></div><div><label>Committente</label><input id="client"></div></div><label>Sede / nota</label><input id="site"><button id="saveMeta" class="btn secondary" style="margin-top:10px">Salva dati lista</button></div><div class="card"><div class="toolbar"><label class="btn secondary" style="margin:0">Importa file/foto<input id="fileInput" type="file" accept="image/*,.csv,.txt,.xlsx,.xls,.pdf,.docx" style="display:none"></label><button id="export" class="btn secondary">Esporta backup</button><label class="btn secondary" style="margin:0">Importa backup<input id="backup" type="file" accept=".json" style="display:none"></label></div><div id="status" class="small" style="margin-top:8px"></div><textarea id="ocr" style="display:none;margin-top:8px" placeholder="Controlla il testo riconosciuto, una persona per riga"></textarea><button id="importOcr" class="btn primary" style="display:none;margin-top:8px">Importa righe riconosciute</button></div><div class="card"><b>Elenco</b><span id="count" class="small" style="float:right"></span><div id="visits"></div></div><div class="card"><b>Riepilogo per committente</b><div class="toolbar" style="float:right"><button id="allClients" class="btn secondary">Tutti</button><button id="noClients" class="btn secondary">Nessuno</button></div><div style="clear:both"></div><div id="filters" class="filters"></div><div class="summary"><div class="box"><b id="sumLists">0</b><span class="small">Liste</span></div><div class="box"><b id="sumVisits">0</b><span class="small">Visite</span></div><div class="box"><b id="sumMoney">€ 0,00</b><span class="small">Compensi</span></div></div><div id="summaryTable"></div></div><div class="card"><b>Compensi per committente</b><div class="small" style="margin-top:5px">Ogni committente mantiene il proprio compenso per visita.</div><div id="feeRows"></div><div class="row" style="margin-top:10px"><div><label>Compenso lista corrente (€)</label><input id="currentFee" readonly></div><div><label>Totale lista corrente (€)</label><input id="currentMoney" readonly></div></div><div id="note" class="small" style="color:#15803d;margin-top:6px"></div></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script><script>const K='conteggio_visite_v2',$=x=>document.getElementById(x),U=s=>(s||'').toLocaleUpperCase('it-IT').trim(),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toISOString().slice(0,10);let S={lists:[],currentId:null,fees:{},clientFilter:[]};function save(){localStorage.setItem(K,JSON.stringify(S))}function cur(){return S.lists.find(x=>x.id===S.currentId)}function mk(render=true){let l={id:id(),date:today(),client:'',site:'',visits:[]};S.lists.unshift(l);S.currentId=l.id;save();if(render)draw()}function load(){try{let x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}if(!Array.isArray(S.lists))S.lists=[];if(!S.fees)S.fees={};if(!Array.isArray(S.clientFilter))S.clientFilter=[];if(!S.lists.length)mk(false);if(!cur())S.currentId=S.lists[0].id;draw()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function clients(){return[...new Set(S.lists.map(l=>U(l.client)).filter(Boolean))].sort()}function selected(){let c=clients(),v=S.clientFilter.filter(x=>c.includes(x));return v.length?v:c}function title(l){return[l.date,U(l.client),U(l.site)].filter(Boolean).join(' · ')||'LISTA'}function draw(){let l=cur();$('listSelect').innerHTML=S.lists.map(x=>`<option value="${x.id}" ${x.id===S.currentId?'selected':''}>${esc(title(x))}</option>`).join('');$('date').value=l.date||'';$('client').value=l.client||'';$('site').value=l.site||'';drawVisits();drawFees();drawSummary()}function drawVisits(){let l=cur(),v=l.visits||[],done=v.filter(x=>x.checked).length,fee=+S.fees[U(l.client)]||0;$('total').textContent=done;$('count').textContent=`${done} visitate su ${v.length}`;$('currentFee').value=fee?fee.toFixed(2):'';$('currentMoney').value=(done*fee).toFixed(2);$('visits').innerHTML=v.map(x=>`<div class="visit ${x.checked?'checked':''}" data-id="${x.id}"><div class="visitTop"><input class="chk" type="checkbox" ${x.checked?'checked':''} style="width:24px;height:24px"><div><div class="visitName">${esc([x.surname,x.name].filter(Boolean).join(' '))}</div><div class="small">${esc(x.company||'')}</div></div><button class="btn danger del">Elimina</button></div><button class="btn secondary edit" style="margin-top:7px">Modifica</button></div>`).join('')||'<div class="small" style="margin-top:8px">Nessun nominativo.</div>';document.querySelectorAll('.visit').forEach(el=>{let x=v.find(z=>z.id===el.dataset.id);el.querySelector('.chk').onchange=e=>{x.checked=e.target.checked;save();drawVisits();drawSummary()};el.querySelector('.del').onclick=()=>{if(confirm('Eliminare questo nominativo?')){l.visits=l.visits.filter(z=>z.id!==x.id);save();drawVisits();drawSummary()}};el.querySelector('.edit').onclick=()=>{$('surname').value=x.surname;$('name').value=x.name;$('company').value=x.company;l.visits=l.visits.filter(z=>z.id!==x.id);save();drawVisits()}})}function drawFees(){let c=clients();$('feeRows').innerHTML=c.length?c.map(x=>`<div class="feeRow"><b>${esc(x)}</b><input class="feeInput" data-c="${esc(x)}" type="number" step="0.01" min="0" value="${S.fees[x]??''}" placeholder="€"><button class="btn secondary feeSave" data-c="${esc(x)}">Salva</button></div>`).join(''):'<div class="small" style="margin-top:8px">Inserisci prima un committente.</div>';document.querySelectorAll('.feeSave').forEach(b=>b.onclick=()=>{let c=b.dataset.c,i=[...document.querySelectorAll('.feeInput')].find(x=>x.dataset.c===c);S.fees[c]=+i.value||0;save();drawVisits();drawSummary();$('note').textContent='Compenso salvato per '+c;setTimeout(()=>$('note').textContent='',1600)})}function drawSummary(){let c=clients();S.clientFilter=S.clientFilter.filter(x=>c.includes(x));let sel=selected();$('filters').innerHTML=c.map(x=>`<label class="chip"><input class="cf" type="checkbox" value="${esc(x)}" ${sel.includes(x)?'checked':''}>${esc(x)}</label>`).join('')||'<span class="small">Nessun committente.</span>';document.querySelectorAll('.cf').forEach(x=>x.onchange=()=>{S.clientFilter=[...document.querySelectorAll('.cf:checked')].map(z=>z.value);save();drawSummary()});let rows=sel.map(c=>{let ls=S.lists.filter(l=>U(l.client)===c),n=ls.reduce((a,l)=>a+l.visits.filter(v=>v.checked).length,0),f=+S.fees[c]||0;return{c,ls:ls.length,n,f,t:n*f}});$('sumLists').textContent=rows.reduce((a,r)=>a+r.ls,0);$('sumVisits').textContent=rows.reduce((a,r)=>a+r.n,0);$('sumMoney').textContent=rows.reduce((a,r)=>a+r.t,0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});$('summaryTable').innerHTML=rows.length?`<table class="tbl"><tr><th>Committente</th><th>€/visita</th><th>Liste</th><th>Visite</th><th>Totale</th></tr>${rows.map(r=>`<tr><td>${esc(r.c)}</td><td>${r.f.toFixed(2)}</td><td>${r.ls}</td><td>${r.n}</td><td>${r.t.toFixed(2)}</td></tr>`).join('')}</table>`:''}function addVisit(s,n,a){s=U(s);n=U(n);a=U(a);if(!s&&!n)return false;let l=cur();if(l.visits.some(v=>U(v.surname)===s&&U(v.name)===n&&U(v.company)===a))return false;l.visits.push({id:id(),surname:s,name:n,company:a,checked:false});return true}function importLines(t){let n=0,def=U($('company').value)||U(cur().client);t.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!/^[,.;:\-]+$/.test(x)).forEach(line=>{let p=line.split(/[;\t,]+/).map(U).filter(Boolean);if(p.length>=2){if(addVisit(p[0],p[1],p.slice(2).join(' ')||def))n++}else{let w=U(line).split(/\s+/);if(w.length>=2&&addVisit(w[0],w.slice(1).join(' '),def))n++}});save();draw();return n}['surname','name','company','client','site'].forEach(i=>$(i).oninput=e=>e.target.value=e.target.value.toLocaleUpperCase('it-IT'));$('add').onclick=()=>{addVisit($('surname').value,$('name').value,$('company').value);$('surname').value='';$('name').value='';save();draw();$('surname').focus()};$('newList').onclick=()=>mk();$('deleteList').onclick=()=>{let l=cur();if(confirm('Eliminare definitivamente questa lista?')){S.lists=S.lists.filter(x=>x.id!==l.id);if(!S.lists.length)mk(false);S.currentId=S.lists[0].id;save();draw()}};$('listSelect').onchange=e=>{S.currentId=e.target.value;save();draw()};$('saveMeta').onclick=()=>{let l=cur();l.date=$('date').value;l.client=U($('client').value);l.site=U($('site').value);save();draw();$('note').textContent='Dati lista salvati';setTimeout(()=>$('note').textContent='',1400)};$('plus').onclick=()=>{let x=cur().visits.find(v=>!v.checked);if(x){x.checked=true;save();drawVisits();drawSummary()}};$('minus').onclick=()=>{let a=cur().visits.filter(v=>v.checked),x=a[a.length-1];if(x){x.checked=false;save();drawVisits();drawSummary()}};$('reset').onclick=()=>{if(confirm('Azzero SOLO le spunte della lista corrente?')){cur().visits.forEach(v=>v.checked=false);save();draw()}};$('allClients').onclick=()=>{S.clientFilter=clients();save();drawSummary()};$('noClients').onclick=()=>{S.clientFilter=[];save();drawSummary()};$('export').onclick=()=>{let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='conteggio_visite_backup_'+today()+'.json';a.click()};$('backup').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.lists))throw 0;S=x;save();draw();alert('Backup importato')}catch{alert('Backup non valido')}e.target.value=''};$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('status').textContent='Lettura in corso…';try{if(/\.(csv|txt)$/i.test(f.name)){let n=importLines(await f.text());$('status').textContent=`Importate ${n} righe`}else if(/\.(xlsx|xls)$/i.test(f.name)){let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),n=0;rows.forEach(r=>{let c=r.map(x=>U(String(x))).filter(Boolean);if(c.length>=2&&!/COGNOME.*NOME/.test(c.join(' '))&&addVisit(c[0],c[1],c[2]||U(cur().client)))n++});save();draw();$('status').textContent=`Importate ${n} righe da Excel`}else if(/\.pdf$/i.test(f.name)){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,t='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}$('status').textContent=`Importate ${importLines(t)} righe da PDF`}else if(/\.docx$/i.test(f.name)){let r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});$('status').textContent=`Importate ${importLines(r.value)} righe da Word`}else if(f.type.startsWith('image/')){let r=await Tesseract.recognize(f,'ita');$('ocr').value=r.data.text;$('ocr').style.display='block';$('importOcr').style.display='inline-block';$('status').textContent='Foto letta: controlla il testo e importa'}else throw 0}catch{$('status').textContent='File non leggibile'}e.target.value=''};$('importOcr').onclick=()=>{$('status').textContent=`Importate ${importLines($('ocr').value)} righe dalla foto`;$('ocr').style.display='none';$('importOcr').style.display='none'};window.addEventListener('pagehide',save);load();</script></body></html>
