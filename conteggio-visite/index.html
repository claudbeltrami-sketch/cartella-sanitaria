<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Conteggio Visite</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:#f3f6fb}header{background:#0b2d5c;color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}h1{font-size:22px;margin:0}.wrap{max-width:780px;margin:auto;padding:10px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0f172a14}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-weight:800;font-size:13px;margin:8px 0 5px}input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}input:not([type]),input[type=text],input[type=search],textarea{text-transform:uppercase}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800;font-size:15px}.primary{background:#1565c0;color:#fff}.secondary{background:#e2e8f0}.danger{background:#c81e1e;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:48px;font-weight:900;text-align:center}.small{font-size:13px;color:#475569}.notice{font-size:13px;color:#15803d;font-weight:800;margin-top:8px}.visit{border:1px solid #dbe2ea;border-radius:12px;padding:10px;margin-top:8px}.visit.checked{background:#ecfdf5}.visitTop{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{display:flex;align-items:center;gap:5px;border:1px solid #cbd5e1;border-radius:999px;padding:7px 9px;font-weight:700}.chip input{width:20px;height:20px;margin:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center}.box b{font-size:22px;display:block}.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.tbl td,.tbl th{border-bottom:1px solid #e2e8f0;padding:7px 4px;text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}.clientRow{display:grid;grid-template-columns:1fr 100px 100px auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0}@media(max-width:560px){.row{grid-template-columns:1fr}.clientRow{grid-template-columns:1fr 1fr}.clientRow b{grid-column:1/-1}.summary{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>Conteggio Visite</h1><button id="reset" class="btn secondary" type="button">Reset spunte</button></header><div class="wrap"><div class="card"><div id="reportVisits" class="big">0</div><div style="text-align:center;font-weight:900">VISITE EFFETTUATE</div><div id="reportCaption" class="small" style="text-align:center"></div><label>Periodo</label><div class="toolbar"><button class="btn secondary period" data-p="today" type="button">Oggi</button><button class="btn secondary period" data-p="day" type="button">Giornata</button><button class="btn secondary period" data-p="month" type="button">Mese</button><button class="btn secondary period" data-p="range" type="button">Da-a</button><button class="btn secondary period" data-p="all" type="button">Tutto</button></div><div id="dayBox" style="display:none"><label>Giornata</label><input id="filterDay" type="date"></div><div id="monthBox" style="display:none"><label>Mese</label><input id="filterMonth" type="month"></div><div id="rangeBox" class="row" style="display:none"><div><label>Dal</label><input id="filterFrom" type="date"></div><div><label>Al</label><input id="filterTo" type="date"></div></div><label>Committenti</label><button id="allClients" class="btn secondary" type="button">Tutti</button><div id="filters" class="filters"></div><div class="summary"><div class="box"><b id="sumDays">0</b><span class="small">Giornate</span></div><div class="box"><b id="sumLists">0</b><span class="small">Liste</span></div><div class="box"><b id="sumVisits">0</b><span class="small">Visite</span></div></div><div id="summaryTable"></div></div><div class="card"><div class="row"><div><label>Cognome</label><input id="surname" autocomplete="off"></div><div><label>Nome</label><input id="name" autocomplete="off"></div></div><label>Azienda</label><input id="company" autocomplete="off"><div class="toolbar" style="margin-top:11px"><button id="add" class="btn primary" type="button">Aggiungi visita</button><button id="newList" class="btn secondary" type="button">Nuova lista</button><button id="deleteList" class="btn danger" type="button">Elimina lista</button></div><div id="addNote" class="notice"></div></div><div class="card"><label>Lista / giornata</label><select id="listSelect"></select><div class="row"><div><label>Data</label><input type="date" id="date"></div><div><label>Committente</label><select id="client"></select></div></div><label>Sede / nota</label><input id="site"><button id="saveMeta" class="btn secondary" type="button" style="margin-top:10px">Salva dati lista</button><div id="metaNote" class="notice"></div></div><div class="card"><b>Gestione committenti</b><div class="small">Il nome viene salvato automaticamente in MAIUSCOLO.</div><label>Nuovo committente</label><input id="newClient" placeholder="ES. CARITAS"><div class="row"><div><label>Compenso indicativo €/visita</label><input id="newFee" type="number" step="0.01" min="0" value="0"></div><div><label>Rimborso indicativo €/giornata</label><input id="newReimb" type="number" step="0.01" min="0" value="0"></div></div><button id="saveClient" class="btn primary" type="button" style="margin-top:10px">Salva committente</button><div id="clientRows"></div><div id="clientNote" class="notice"></div></div><div class="card"><div class="toolbar"><label class="btn secondary" style="margin:0">Importa CSV/TXT<input id="fileInput" type="file" accept=".csv,.txt" style="display:none"></label><button id="export" class="btn secondary" type="button">Esporta backup</button><label class="btn secondary" style="margin:0">Importa backup<input id="backup" type="file" accept=".json" style="display:none"></label></div><div id="status" class="small"></div></div><div class="card"><b>Elenco</b><span id="count" class="small" style="float:right"></span><div id="visits"></div></div><div class="card"><b>Valori economici indicativi</b><div class="row"><div><label>€/visita</label><input id="currentFee" readonly></div><div><label>Rimborso/giornata</label><input id="currentReimb" readonly></div></div><label>Totale indicativo</label><input id="currentMoney" readonly></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),U=s=>String(s||'').toLocaleUpperCase('it-IT').trim(),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},month=()=>today().slice(0,7),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),K='conteggio_visite_v3_web';let S={lists:[],currentId:null,clients:{},clientFilter:[],report:{period:'month',day:today(),month:month(),from:today(),to:today()}};const cur=()=>S.lists.find(x=>x.id===S.currentId),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function persist(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert('Il browser non consente il salvataggio locale. Apri questa pagina dal link web in Safari o Chrome.');return false}}function ensureClient(n){n=U(n);if(!n)return;if(!S.clients[n])S.clients[n]={fee:0,reimbursement:0};S.clients[n].fee=Number(S.clients[n].fee)||0;S.clients[n].reimbursement=Number(S.clients[n].reimbursement)||0}function migrate(){if(!Array.isArray(S.lists))S.lists=[];if(!S.clients||typeof S.clients!=='object'||Array.isArray(S.clients))S.clients={};if(!Array.isArray(S.clientFilter))S.clientFilter=[];if(!S.report)S.report={};Object.assign(S.report,{period:S.report.period||'month',day:S.report.day||today(),month:S.report.month||month(),from:S.report.from||today(),to:S.report.to||today()});S.lists.forEach(l=>{l.client=U(l.client);l.site=U(l.site);if(!Array.isArray(l.visits))l.visits=[];l.visits.forEach(v=>{v.surname=U(v.surname);v.name=U(v.name);v.company=U(v.company);v.checked=!!v.checked});ensureClient(l.client)})}function newList(render=true){const l={id:uid(),date:today(),client:'',site:'',visits:[]};S.lists.unshift(l);S.currentId=l.id;persist();if(render)draw()}function load(){try{const raw=localStorage.getItem(K);if(raw)S=JSON.parse(raw)}catch(e){}migrate();if(!S.lists.length)newList(false);if(!cur())S.currentId=S.lists[0].id;persist();draw()}const names=()=>Object.keys(S.clients).sort();function drawClientSelect(){const l=cur(),n=names();$('client').innerHTML='<option value="">— SELEZIONA —</option>'+n.map(c=>'<option value="'+esc(c)+'"'+(c===U(l.client)?' selected':'')+'>'+esc(c)+'</option>').join('')}function title(l){return[l.date,U(l.client),U(l.site)].filter(Boolean).join(' · ')||'LISTA'}function draw(){const l=cur();$('listSelect').innerHTML=S.lists.map(x=>'<option value="'+x.id+'"'+(x.id===S.currentId?' selected':'')+'>'+esc(title(x))+'</option>').join('');$('date').value=l.date;$('site').value=l.site;drawClientSelect();drawClients();drawVisits();drawSummary();$('filterDay').value=S.report.day;$('filterMonth').value=S.report.month;$('filterFrom').value=S.report.from;$('filterTo').value=S.report.to;drawPeriod()}function drawPeriod(){$('dayBox').style.display=S.report.period==='day'?'block':'none';$('monthBox').style.display=S.report.period==='month'?'block':'none';$('rangeBox').style.display=S.report.period==='range'?'grid':'none'}function drawClients(){$('clientRows').innerHTML=names().map(c=>{const x=S.clients[c];return '<div class="clientRow" data-c="'+esc(c)+'"><b>'+esc(c)+'</b><input class="fee" type="number" step="0.01" value="'+x.fee+'"><input class="reimb" type="number" step="0.01" value="'+x.reimbursement+'"><div><button class="btn secondary saveC" type="button">Salva</button> <button class="btn danger delC" type="button">Elimina</button></div></div>'}).join('')||'<div class="small">Nessun committente salvato.</div>';document.querySelectorAll('.clientRow').forEach(r=>{const c=r.dataset.c;r.querySelector('.saveC').onclick=()=>{S.clients[c].fee=Number(r.querySelector('.fee').value)||0;S.clients[c].reimbursement=Number(r.querySelector('.reimb').value)||0;persist();drawVisits();drawSummary();note('clientNote','Dati salvati per '+c)};r.querySelector('.delC').onclick=()=>{if(S.lists.some(l=>U(l.client)===c)){alert('Committente usato in una lista: non può essere eliminato.');return}if(confirm('Eliminare '+c+'?')){delete S.clients[c];S.clientFilter=S.clientFilter.filter(x=>x!==c);persist();draw()}}})}function drawVisits(){const l=cur(),v=l.visits||[],done=v.filter(x=>x.checked).length,cfg=S.clients[U(l.client)]||{fee:0,reimbursement:0};$('count').textContent=done+' visitate su '+v.length;$('currentFee').value=(Number(cfg.fee)||0).toFixed(2);$('currentReimb').value=(Number(cfg.reimbursement)||0).toFixed(2);$('currentMoney').value=(done*(Number(cfg.fee)||0)+(done?Number(cfg.reimbursement)||0:0)).toFixed(2);$('visits').innerHTML=v.map(x=>'<div class="visit '+(x.checked?'checked':'')+'" data-id="'+x.id+'"><div class="visitTop"><input class="chk" type="checkbox" '+(x.checked?'checked':'')+' style="width:24px;height:24px"><div><b>'+esc([x.surname,x.name].filter(Boolean).join(' '))+'</b><div class="small">'+esc(x.company)+'</div></div><button class="btn danger delV" type="button">Elimina</button></div></div>').join('')||'<div class="small">Nessun nominativo.</div>';document.querySelectorAll('.visit').forEach(r=>{const x=v.find(z=>z.id===r.dataset.id);r.querySelector('.chk').onchange=e=>{x.checked=e.target.checked;persist();drawVisits();drawSummary()};r.querySelector('.delV').onclick=()=>{if(confirm('Eliminare questo nominativo?')){l.visits=l.visits.filter(z=>z.id!==x.id);persist();drawVisits();drawSummary()}}})}function matches(l){const d=l.date||'';if(S.report.period==='today')return d===today();if(S.report.period==='day')return d===S.report.day;if(S.report.period==='month')return d.startsWith(S.report.month||'');if(S.report.period==='range')return(!S.report.from||d>=S.report.from)&&(!S.report.to||d<=S.report.to);return true}function drawSummary(){const all=names();S.clientFilter=S.clientFilter.filter(x=>all.includes(x));const sel=S.clientFilter.length?S.clientFilter:all;$('filters').innerHTML=all.map(c=>'<label class="chip"><input class="cf" type="checkbox" value="'+esc(c)+'" '+(S.clientFilter.includes(c)?'checked':'')+'>'+esc(c)+'</label>').join('')||'<span class="small">Nessun committente.</span>';document.querySelectorAll('.cf').forEach(x=>x.onchange=()=>{S.clientFilter=[...document.querySelectorAll('.cf:checked')].map(z=>z.value);persist();drawSummary()});const ls=S.lists.filter(l=>matches(l)&&sel.includes(U(l.client)));const rows=sel.map(c=>{const a=ls.filter(l=>U(l.client)===c),n=a.reduce((q,l)=>q+l.visits.filter(v=>v.checked).length,0),days=new Set(a.filter(l=>l.visits.some(v=>v.checked)).map(l=>l.date)).size;return{c,n,lists:a.length,days}}).filter(r=>r.lists||r.n);$('sumVisits').textContent=$('reportVisits').textContent=rows.reduce((a,r)=>a+r.n,0);$('sumLists').textContent=rows.reduce((a,r)=>a+r.lists,0);$('sumDays').textContent=new Set(ls.filter(l=>l.visits.some(v=>v.checked)).map(l=>l.date)).size;$('reportCaption').textContent=(S.report.period==='month'?S.report.month:S.report.period==='day'?S.report.day:S.report.period==='today'?'Oggi':S.report.period==='range'?S.report.from+' → '+S.report.to:'Tutto')+' · '+(S.clientFilter.length?S.clientFilter.join(', '):'tutti i committenti');$('summaryTable').innerHTML=rows.length?'<table class="tbl"><tr><th>Committente</th><th>Giornate</th><th>Liste</th><th>Visite</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.c)+'</td><td>'+r.days+'</td><td>'+r.lists+'</td><td><b>'+r.n+'</b></td></tr>').join('')+'</table>':'<div class="small">Nessuna visita nel periodo selezionato.</div>'}function addVisit(){const s=U($('surname').value),n=U($('name').value),a=U($('company').value);if(!s&&!n){alert('Inserisci almeno cognome o nome.');return}const l=cur();l.visits.push({id:uid(),surname:s,name:n,company:a,checked:false});persist();$('surname').value='';$('name').value='';drawVisits();drawSummary();note('addNote','Visita aggiunta');$('surname').focus()}function note(id,t){$(id).textContent=t;setTimeout(()=>{if($(id).textContent===t)$(id).textContent=''},1800)}document.addEventListener('input',e=>{if(e.target.matches('input:not([type]),input[type=text],input[type=search],textarea')){const p=e.target.selectionStart;e.target.value=e.target.value.toLocaleUpperCase('it-IT');try{e.target.setSelectionRange(p,p)}catch{}}},true);$('saveClient').onclick=()=>{const c=U($('newClient').value);if(!c){alert('Scrivi il nome del committente.');return}ensureClient(c);S.clients[c].fee=Number($('newFee').value)||0;S.clients[c].reimbursement=Number($('newReimb').value)||0;cur().client=c;if(persist()){$('newClient').value='';$('newFee').value='0';$('newReimb').value='0';draw();note('clientNote','Committente '+c+' salvato e selezionato')}};$('add').onclick=addVisit;$('newList').onclick=()=>newList();$('deleteList').onclick=()=>{if(confirm('Eliminare definitivamente questa lista?')){S.lists=S.lists.filter(x=>x.id!==S.currentId);if(!S.lists.length)newList(false);S.currentId=S.lists[0].id;persist();draw()}};$('listSelect').onchange=e=>{S.currentId=e.target.value;persist();draw()};$('client').onchange=e=>{cur().client=U(e.target.value);ensureClient(cur().client);persist();draw()};$('saveMeta').onclick=()=>{cur().date=$('date').value;cur().client=U($('client').value);cur().site=U($('site').value);ensureClient(cur().client);persist();draw();note('metaNote','Dati lista salvati')};$('reset').onclick=()=>{if(confirm('Azzero SOLO le spunte della lista corrente?')){cur().visits.forEach(v=>v.checked=false);persist();draw()}};document.querySelectorAll('.period').forEach(b=>b.onclick=()=>{S.report.period=b.dataset.p;persist();drawPeriod();drawSummary()});$('filterDay').onchange=e=>{S.report.day=e.target.value;persist();drawSummary()};$('filterMonth').onchange=e=>{S.report.month=e.target.value;persist();drawSummary()};$('filterFrom').onchange=e=>{S.report.from=e.target.value;persist();drawSummary()};$('filterTo').onchange=e=>{S.report.to=e.target.value;persist();drawSummary()};$('allClients').onclick=()=>{S.clientFilter=[];persist();drawSummary()};$('export').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='conteggio_visite_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('backup').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.lists))throw 0;S=x;migrate();persist();draw();alert('Backup importato')}catch{alert('Backup non valido')}e.target.value=''};$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const t=await f.text();let n=0;t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const p=line.split(/[;,\t]+/).map(U).filter(Boolean);if(p.length>=2){cur().visits.push({id:uid(),surname:p[0],name:p[1],company:p.slice(2).join(' ')||U(cur().client),checked:false});n++}});persist();draw();$('status').textContent='Importate '+n+' righe'}catch{$('status').textContent='File non leggibile'}e.target.value=''};window.addEventListener('pagehide',persist);load()})();</script></body></html>
