<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUMEN - Importa lista iPhone</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--blu:#1f5f99;--verde:#287a46;--rosso:#a23b3b;--grigio:#555;--bg:#eef1f4}*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#111}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:2px solid var(--blu);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #9995}h1{margin:0 0 8px;color:var(--blu);font-size:23px}.sub{color:#444;line-height:1.4}.buttons{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.btn,.fileTrigger{border:0;border-radius:10px;min-height:52px;padding:12px 16px;font-weight:800;font-size:16px;color:#fff;background:var(--blu);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.success{background:var(--verde)}.secondary{background:var(--grigio)}.danger{background:var(--rosso)}.fileTrigger input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}.status{font-weight:700;margin-top:12px;padding:11px;border-radius:8px;background:#f4f6f8}.ok{border-left:6px solid var(--verde)}.err{border-left:6px solid var(--rosso)}.hidden{display:none}.list{margin-top:12px;border:1px solid #bbb;border-radius:9px;overflow:hidden}.row{padding:9px;border-bottom:1px solid #ddd}.row:last-child{border-bottom:0}.small{font-size:12px;color:#555;margin-top:4px}
</style>
</head>
<body><div class="wrap">
<section class="card"><h1>LUMEN · IMPORTA LISTA SU iPHONE</h1><div class="sub">Versione dedicata a Safari/iPhone. Il selettore file è nativo e la lista viene salvata nello stesso archivio locale di LUMEN.</div><div class="buttons"><label class="fileTrigger success">TOCCA QUI E SCEGLI EXCEL / CSV<input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt"></label><button id="openMain" class="btn secondary" type="button">TORNA A LUMEN</button></div><div id="status" class="status">NESSUN FILE SELEZIONATO.</div></section>
<section id="previewCard" class="card hidden"><h1 style="font-size:20px">ANTEPRIMA</h1><div id="summary" class="sub"></div><div id="list" class="list"></div><div class="buttons"><button id="confirm" class="btn success" type="button">CONFERMA IMPORTAZIONE</button><button id="cancel" class="btn danger" type="button">ANNULLA</button></div></section>
<section id="doneCard" class="card hidden"><h1 style="font-size:20px;color:var(--verde)">LISTA IMPORTATA</h1><div id="doneText" class="sub"></div><div class="buttons"><button id="go" class="btn success" type="button">APRI LUMEN CON QUESTA LISTA</button></div></section>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const fileInput=$('file'),statusEl=$('status'),previewCardEl=$('previewCard'),summaryEl=$('summary'),listEl=$('list'),confirmBtn=$('confirm'),cancelBtn=$('cancel'),doneCardEl=$('doneCard'),doneTextEl=$('doneText'),openMainBtn=$('openMain'),goBtn=$('go');
const LISTS_KEY='beltrami_worker_lists_v1',ACTIVE_KEY='beltrami_worker_list_active_v1',WORKERS_KEY='beltrami_workers_v8';let workers=[],fileName='';
const norm=v=>String(v??'').trim().toLocaleUpperCase('it-IT');const key=v=>norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
function readLocal(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(_){return d}}
function saveCurrentList(){const old=readLocal(WORKERS_KEY,{workers:[]});if(!Array.isArray(old.workers)||!old.workers.length)return;const lists=readLocal(LISTS_KEY,[]),active=localStorage.getItem(ACTIVE_KEY)||'';const rec={id:active||('LISTA_'+Date.now()),label:String(old.attachedSourceName||'LISTA').replace(/\.(xlsx?|csv|pdf|docx?|json)$/i,''),workers:old.workers,currentWorkerIndex:Number.isInteger(old.currentWorkerIndex)?old.currentWorkerIndex:-1,attachedSourceName:old.attachedSourceName||'',session:readLocal('beltrami_v9_sessione_attiva',null),esiti:readLocal('beltrami_v9_esiti',{}),updated:new Date().toISOString()};const i=lists.findIndex(x=>x.id===rec.id);if(i>=0)lists[i]=rec;else lists.push(rec);localStorage.setItem(LISTS_KEY,JSON.stringify(lists));if(rec.id)localStorage.setItem(ACTIVE_KEY,rec.id)}
function iso(v){if(v==null||v==='')return'';if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);let s=String(v).trim(),m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m){let y=m[3].length===2?(Number(m[3])>40?'19':'20')+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);return''}
function findHeader(rows){const aliases=['COGNOME','NOME','CODICEFISCALE','CF','DATANASCITA','LUOGONASCITA','SOCIETA','AZIENDA','SEDE'];let best=0,score=-1;for(let r=0;r<Math.min(rows.length,15);r++){let s=(rows[r]||[]).map(key).reduce((n,x)=>n+(aliases.some(a=>x===a||x.includes(a))?1:0),0);if(s>score){score=s;best=r}}return best}
function idx(headers,names){const h=headers.map(key);for(const n of names){let i=h.indexOf(n);if(i>=0)return i}for(let i=0;i<h.length;i++)if(names.some(n=>h[i].includes(n)))return i;return -1}
async function fileBuffer(f){if(typeof f.arrayBuffer==='function')return f.arrayBuffer();return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Lettura file non riuscita'));r.readAsArrayBuffer(f)})}
async function parseFile(f){fileName=f.name;const buf=await fileBuffer(f);if(!window.XLSX)throw new Error('Libreria Excel non caricata. Riapri la pagina con connessione attiva.');const ext=f.name.toLowerCase().split('.').pop();let wb;if(['csv','tsv','txt'].includes(ext)){const text=new TextDecoder('utf-8').decode(buf);wb=XLSX.read(text,{type:'string',cellDates:true})}else wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});const hr=findHeader(rows),headers=rows[hr]||[],m={c:idx(headers,['COGNOME']),n:idx(headers,['NOME']),cf:idx(headers,['CODICEFISCALE','CF']),dn:idx(headers,['DATANASCITA']),ln:idx(headers,['LUOGONASCITA']),az:idx(headers,['SOCIETA','AZIENDA','DATORELAVORO']),se:idx(headers,['SEDE']),ma:idx(headers,['MANSIONE']),or:idx(headers,['ORARIO','ORAVISITA'])};workers=[];for(let r=hr+1;r<rows.length;r++){const row=rows[r]||[],cognome=m.c>=0?norm(row[m.c]):'',nome=m.n>=0?norm(row[m.n]):'';if(!cognome&&!nome)continue;workers.push({id:'IMP_'+Date.now()+'_'+r,cognome,nome,codice_fiscale:m.cf>=0?norm(row[m.cf]).replace(/\s+/g,''):'',data_nascita:m.dn>=0?iso(row[m.dn]):'',luogo_nascita:m.ln>=0?norm(row[m.ln]):'',datore_lavoro:m.az>=0?norm(row[m.az]):'',sede:m.se>=0?norm(row[m.se]):'',mansione:m.ma>=0?norm(row[m.ma]):'',orario:m.or>=0?String(row[m.or]??'').trim():'',visited:false})}if(!workers.length)throw new Error('Nessun lavoratore riconosciuto nel file.');render()}
function render(){previewCardEl.classList.remove('hidden');doneCardEl.classList.add('hidden');summaryEl.textContent=fileName+' — '+workers.length+' lavoratori riconosciuti.';listEl.innerHTML=workers.map((w,i)=>'<div class="row"><b>'+(i+1)+'. '+w.cognome+' '+w.nome+'</b><div class="small">'+[w.codice_fiscale,w.datore_lavoro,w.sede].filter(Boolean).join(' · ')+'</div></div>').join('');statusEl.className='status ok';statusEl.textContent='FILE LETTO CORRETTAMENTE. CONTROLLA I NOMI E PREMI CONFERMA IMPORTAZIONE.'}
fileInput.addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{statusEl.className='status';statusEl.textContent='LETTURA FILE IN CORSO...';await parseFile(f)}catch(err){workers=[];previewCardEl.classList.add('hidden');statusEl.className='status err';statusEl.textContent='ERRORE: '+(err.message||String(err))}finally{fileInput.value=''}});
confirmBtn.addEventListener('click',()=>{if(!workers.length)return;saveCurrentList();const id='LISTA_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),lists=readLocal(LISTS_KEY,[]);lists.push({id,label:fileName.replace(/\.(xlsx?|csv|tsv|txt)$/i,''),workers,currentWorkerIndex:-1,attachedSourceName:fileName,session:null,esiti:{},updated:new Date().toISOString()});localStorage.setItem(LISTS_KEY,JSON.stringify(lists));localStorage.setItem(ACTIVE_KEY,id);localStorage.setItem(WORKERS_KEY,JSON.stringify({workers,currentWorkerIndex:-1,attachedSourceName:fileName}));localStorage.removeItem('beltrami_v9_sessione_attiva');localStorage.setItem('beltrami_v9_esiti','{}');previewCardEl.classList.add('hidden');doneCardEl.classList.remove('hidden');doneTextEl.textContent='Importati '+workers.length+' lavoratori. La lista precedente è stata conservata nello storico.';statusEl.className='status ok';statusEl.textContent='IMPORTAZIONE COMPLETATA.'});
cancelBtn.addEventListener('click',()=>{workers=[];previewCardEl.classList.add('hidden');statusEl.className='status';statusEl.textContent='IMPORTAZIONE ANNULLATA. NESSUNA MODIFICA ESEGUITA.'});
function openLumen(){location.href='./index.html?v=20260905-iphone-import-fix2'}openMainBtn.addEventListener('click',openLumen);goBtn.addEventListener('click',openLumen);
})();
</script></body></html>
